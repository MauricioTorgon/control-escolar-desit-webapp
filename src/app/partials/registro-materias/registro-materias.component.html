<!-- Formularios (vistas) de cada usuario (inyección dinámica) -->
<div class="wrapper">
  <div class="section-registro">
    <div class="body-registro">
      <div class="row mt-3 mb-3">
        <div class="form-group col-12">
          <label class="title-user" for="tipo_usuario">Ingresa los datos de la materia</label>
        </div>
      </div>

      <mat-form-field class="mat-input" appearance="outline">
        <mat-label>NRC</mat-label>
        <input matInput [(ngModel)]="materia.nrc" name="nrc" placeholder="Escribe el NRC" type="number" min="0" >
      </mat-form-field>
      <div *ngIf="errors.nrc" class="invalid-feedback">{{ errors.nrc }}</div>

      <mat-form-field class="mat-input" appearance="outline">
        <mat-label>Nombre de la materia</mat-label>
        <input matInput [(ngModel)]="materia.nombre" name="nombre" placeholder="Escribe nombre de la materia">
      </mat-form-field>
      <div *ngIf="errors.nombre" class="invalid-feedback">{{ errors.nombre }}</div>

      <mat-form-field class="mat-input" appearance="outline">
        <mat-label>Sección</mat-label>
        <input matInput [(ngModel)]="materia.seccion" name="seccion" placeholder="Escribe la sección">
      </mat-form-field>
      <div *ngIf="errors.seccion" class="invalid-feedback">{{ errors.seccion }}</div>

      <!-- Selección de días de clase -->
      <div class="select-materias">
        <div class="row mt-3 mb-3">
          <div class="form-group col-12">
            <label class="title-materias" for="tipo_usuario">Selecciona los días de clase que se impartirá la materia</label>
          </div>
          <div class="checkbox-group" style="display:flex; flex-direction: column;">
            <mat-checkbox class="checkbox-item opc-sc" [(ngModel)]="dias.Lunes" name="Lunes" color="primary">
              <div class="d-checkbox-nombre">Lunes</div>
            </mat-checkbox>
            <mat-checkbox class="checkbox-item opc-sc" [(ngModel)]="dias.Martes" name="Martes" color="primary">
              <div class="d-checkbox-nombre">Martes</div>
            </mat-checkbox>
            <mat-checkbox class="checkbox-item opc-sc" [(ngModel)]="dias.Miercoles" name="Miercoles" color="primary">
              <div class="d-checkbox-nombre">Miércoles</div>
            </mat-checkbox>
            <mat-checkbox class="checkbox-item opc-sc" [(ngModel)]="dias.Jueves" name="Jueves" color="primary">
              <div class="d-checkbox-nombre">Jueves</div>
            </mat-checkbox>
            <mat-checkbox class="checkbox-item opc-sc" [(ngModel)]="dias.Viernes" name="Viernes" color="primary">
              <div class="d-checkbox-nombre">Viernes</div>
            </mat-checkbox>
            <mat-checkbox class="checkbox-item opc-sc" [(ngModel)]="dias.Sabado" name="Sabado" color="primary">
              <div class="d-checkbox-nombre">Sábado</div>
            </mat-checkbox>
          </div>
        </div>
      </div>


      <div *ngIf="errors.dias" class="invalid-feedback">{{ errors.dias }}</div>

      <!--NGX Time Picker-->
      <div class="row time-row">
        <mat-form-field class="mat-input" appearance="outline">
          <mat-label>Hora Inicio</mat-label>
          <input matInput [ngxTimepicker]="pickerInicio" [format]="24" placeholder="Selecciona hora"
            [(ngModel)]="materia.horaInicio" name="horaInicio" readonly>
          <ngx-material-timepicker-toggle matSuffix [for]="pickerInicio">
            <mat-icon matDatepickerToggleIcon>access_time</mat-icon>
          </ngx-material-timepicker-toggle>
          <ngx-material-timepicker #pickerInicio></ngx-material-timepicker>
        </mat-form-field>
        <div *ngIf="errors.horaInicio" class="invalid-feedback">{{ errors.horaInicio }}</div>

        <mat-form-field class="mat-input" appearance="outline">
          <mat-label>Hora Fin</mat-label>
          <input matInput [ngxTimepicker]="pickerFin" [format]="24" placeholder="Selecciona hora"
            [(ngModel)]="materia.horaFin" name="horaFin" readonly>
          <ngx-material-timepicker-toggle matSuffix [for]="pickerFin">
            <mat-icon matDatepickerToggleIcon>access_time</mat-icon>
          </ngx-material-timepicker-toggle>
          <ngx-material-timepicker #pickerFin></ngx-material-timepicker>
        </mat-form-field>
        <div *ngIf="errors.horaFin" class="invalid-feedback">{{ errors.horaFin }}</div>
      </div>

      <div class="section-buttons">
        <button class="btn btn-danger" (click)="regresar()">Cancelar</button>
        <button *ngIf="!editar" class="btn btn-primary" type="submit" (click)="registrar()">Registrar</button>
        <button *ngIf="editar" class="btn btn-primary" type="submit" (click)="actualizar()">Actualizar</button>
      </div>
    </div>
  </div>
</div>
